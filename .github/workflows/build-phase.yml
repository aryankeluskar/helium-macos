name: Build Helium for macOS

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      os:
        required: true
        type: string
      resume:
        required: false
        type: boolean
        default: false
      resume_run:
        required: false
        type: string
        default: ""
      resume_patch:
        required: false
        type: string
        default: ""
      build_tool:
        required: false
        type: string
        default: "ninja"
      cache_run:
        required: false
        type: string
        default: ""
    outputs:
      status:
        value: ${{ jobs.build_job.outputs.status }}

jobs:
  build_job:
    name: Build Helium for macOS
    runs-on: ${{ inputs.os }}
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: ./.github/actions/prepare-environment
      - name: Download resources
        if: ${{ !inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: helium_macos_resources_${{ inputs.arch }}
      - name: Unpack resources
        if: ${{ !inputs.resume }}
        run: ./github_unpack_resources.sh
      - name: Prepare for building
        if: ${{ !inputs.resume }}
        run: |
          set -o pipefail
          source ./devutils/shared.sh
          configure_build '${{ inputs.arch }}' ci | tee -a github_actions_build_${{ inputs.arch }}.log
        env:
          PROD_MACOS_SPARKLE_ED_PUB_KEY: ${{ secrets.PROD_MACOS_SPARKLE_ED_PUB_KEY }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
          HELIUM_BUILD_TOOL: ${{ inputs.build_tool }}
      - name: Find the last finished build's compile cache
        id: seed
        if: ${{ !inputs.resume }}
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_NAME: compile_cache_${{ inputs.arch }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$CACHE_NAME&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          echo "run=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the last finished build's compile cache
        if: ${{ !inputs.resume && steps.seed.outputs.run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: compile_cache_${{ inputs.arch }}
          path: seed-cache
          run-id: ${{ steps.seed.outputs.run }}
          github-token: ${{ github.token }}
      - name: Start from the last finished build's compile cache
        if: ${{ !inputs.resume && steps.seed.outputs.run != '' }}
        run: |
          tar -C build/src/out -xf seed-cache/sccache.tar
          rm -rf seed-cache
          du -sh build/src/out/sccache
      - name: Get previous logs
        if: ${{ inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_logs_${{ inputs.arch }}
          run-id: ${{ inputs.resume_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download build
        if: ${{ inputs.resume }}
        uses: actions/download-artifact@v4
        with:
          name: github_build_artifact_${{ inputs.arch }}
          run-id: ${{ inputs.resume_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Unpack archive of build
        if: ${{ inputs.resume }}
        run: ./github_unpack_archive.sh
      - name: Apply patch to the resumed tree
        if: ${{ inputs.resume && inputs.resume_patch != '' }}
        env:
          RESUME_PATCH: ${{ inputs.resume_patch }}
        run: patch -d build/src -p1 --forward < "$GITHUB_WORKSPACE/$RESUME_PATCH"
      - name: Download compile caches from parallel shards
        if: ${{ inputs.resume && inputs.cache_run != '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: sccache-shard-*
          path: shard-caches
          run-id: ${{ inputs.cache_run }}
          github-token: ${{ github.token }}
      - name: Merge the shard caches into the tree's cache
        if: ${{ inputs.resume && inputs.cache_run != '' }}
        run: |
          mkdir -p build/src/out/sccache
          for cache in shard-caches/*/shard-cache.tar; do
            tar -C build/src/out/sccache -xf "$cache"
            rm "$cache"
          done
          du -sh build/src/out/sccache
      - uses: ./.github/actions/do-build
        id: build
        with:
          arch: ${{ inputs.arch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_NAME }}
          MACOS_CI_KEYCHAIN_PWD: ${{ secrets.PROD_MACOS_CI_KEYCHAIN_PWD }}
          PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
          PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
          PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
          PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64: ${{ secrets.PROD_MACOS_SPECIAL_ENTITLEMENTS_PROFILE_B64 }}
