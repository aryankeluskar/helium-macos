name: Check self-updates

# The self-update check from demo.yml on its own, for a quick rerun: push
# .github/diagnostics/update-check-run holding a build's run ID.

on:
  push:
    paths:
      - '.github/diagnostics/update-check-run'

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: Install release 1, update to release 2
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get Hydrogen
        env:
          GH_TOKEN: ${{ github.token }}
        run: BUILD_RUN=$(cat .github/diagnostics/update-check-run) .github/demo/get-hydrogen.sh
      - name: Check that Hydrogen updates itself
        run: .github/demo/update-check.sh
      - name: Show the logs
        if: ${{ always() }}
        run: |
          for file in demo-out/*; do
            case "$file" in *.png|*.dmg) continue ;; esac
            echo "=== $file"
            tail -80 "$file"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: update-check
          path: demo-out/
