name: Record a spaces demo

on:
  workflow_dispatch:
    inputs:
      build_run:
        required: false
        description: "Run ID of a Build macOS binaries of Helium run whose Hydrogen DMG to record"
        default: ""
  workflow_call:
    inputs:
      build_run:
        required: false
        type: string
        default: ""
    outputs:
      failed_checks:
        description: "How many checks in verify.md failed"
        value: ${{ jobs.record.outputs.failed_checks }}

permissions:
  contents: write
  actions: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record two-finger swipes between spaces
    runs-on: macos-latest
    timeout-minutes: 65
    outputs:
      failed_checks: ${{ steps.result.outputs.failed_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Get Hydrogen
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: .github/demo/get-hydrogen.sh
      - name: Record
        run: .github/demo/demo.sh
      - name: Verify the build
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: .github/demo/verify.sh
      - name: Check ad blocking breadth, the web store and the vertical tab strip
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        run: .github/demo/deep-checks.sh
      - name: Check spaces with synthetic keyboard, mouse and trackpad input
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 12
        run: .github/demo/spaces-checks.sh
      - name: Check that Hydrogen updates itself
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 12
        run: .github/demo/update-check.sh
      - name: Count failed checks
        id: result
        if: ${{ !cancelled() }}
        run: |
          failed=$(grep -c '❌' demo-out/verify.md 2>/dev/null || true)
          if ! grep -q '✅' demo-out/verify.md 2>/dev/null; then
            failed=$((${failed:-0} + 1))
          fi
          echo "failed_checks=${failed:-0}" >> "$GITHUB_OUTPUT"
          echo "${failed:-0} failed checks"
      - name: Compare ad blocking with Brave
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 20
        run: .github/demo/compare-brave.sh
      - name: Compare safety defaults with Brave
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 12
        run: .github/demo/safety-checks.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: spaces-demo
          path: demo-out/
      - name: Publish to the demo-videos branch
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd demo-out
          rm -f hydrogen.log.gz && gzip -k hydrogen.log || true
          rm -f hydrogen.log
          git init -q -b demo-videos
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Spaces demo from ${GITHUB_SHA::7}, build run ${{ inputs.build_run || 'official release' }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-videos
