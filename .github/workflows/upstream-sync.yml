name: Follow upstream Helium

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  DREAM_BRANCH: claude/arc-spaces
  UPSTREAM: https://github.com/imputnet/helium-macos

jobs:
  sync:
    name: Merge upstream Helium and rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DREAM_BRANCH }}
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already on upstream $(git rev-parse --short upstream/main)."
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            git merge --abort
            title="Upstream Helium doesn't merge into $DREAM_BRANCH"
            body="Upstream main is at $(git rev-parse --short upstream/main) and merging it into \`$DREAM_BRANCH\` conflicts. Merge it by hand so the fork keeps getting Chromium security fixes."
            if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
            exit 1
          fi

          git push origin "HEAD:$DREAM_BRANCH"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Build the merged branch
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$DREAM_BRANCH" -f arches='["arm64"]'
